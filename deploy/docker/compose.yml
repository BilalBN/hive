# Hive and Tailscale side by side: Hive is reachable only on your private
# Tailscale network (as "hive"), never on your home network or the internet.
#
# 1. Make an auth key: Tailscale admin console → Settings → Keys → Generate
#    auth key (reusable off, ephemeral off). Put it in .env as TS_AUTHKEY=...
# 2. Set MUSIC to your music folder in .env (MUSIC=/srv/music).
# 3. docker compose up -d, then: docker compose logs hive | grep "setup code"
# 4. On a device in your tailnet: http://hive:8443/admin/ (or the IP Tailscale
#    shows), and type the setup code.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: hive
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  hive:
    build: ../..
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - HIVE_HOME_NAME=${HOME_NAME:-Our home}
    volumes:
      - ./data:/data
      # Hive reads music from here; it writes only uploads, and deletes a
      # copy only when you ask (Hive Admin → Library).
      - ${MUSIC:?Set MUSIC to your music folder in .env}:/music
    restart: unless-stopped
