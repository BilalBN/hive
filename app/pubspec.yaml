name: hive
description: "Hive: the family's music, from home."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.0
  shared_preferences: ^2.5.0

# shared_preferences_android 2.5.0 (17 Oct 2026) moved to JNI and fails in
# release builds with NoSuchMethodError on getAll, so the app can't start.
# Hold the last method-channel version until a fixed release passes CI's
# Android emulator check.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  # Bundled so the app never fetches fonts from the internet. Licences sit
  # beside the files in assets/fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMalayalam_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMalayalam_700Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari_700Bold.ttf
          weight: 700
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
