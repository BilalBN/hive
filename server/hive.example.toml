# Copy to data/hive.toml (next to the database) and edit.
# Every setting can also be set with an environment variable: HIVE_<NAME>.

home_name = "Our home"               # what the family sees
admin_display_name = "Admin"        # used in family-facing copy

# "tailscale" listens on this computer only plus its Tailscale address:
# reachable from family devices on the private network, nowhere else.
host = "tailscale"
port = 8443

# HTTPS with a certificate from Tailscale (run `tailscale cert <machine>.<tailnet>.ts.net`):
# Use full paths:
# tls_cert = "/Users/you/hive/data/certs/hive-pc.tailnet.ts.net.crt"
# tls_key  = "/Users/you/hive/data/certs/hive-pc.tailnet.ts.net.key"

# Folders Hive reads music from. Copy albums in and they appear in the apps.
music_folders = ["~/Music/Hive"]
# Browser uploads from Hive Admin land here (default: "Uploads" in the first music folder).
# upload_folder = "~/Music/Hive/Uploads"

# FFmpeg makes the High and Data saver streams and measures loudness for
# volume levelling. Found automatically on PATH or in Homebrew's folder.
# ffmpeg = "/opt/homebrew/bin/ffmpeg"
log_level = "INFO"
min_app_version = "0.1.0"

# Look up album details, covers, language and films online (MusicBrainz,
# Cover Art Archive, Wikidata). Album and artist names, song titles and
# lengths leave home; never the music. Hive Admin can switch it too.
lookup_online = true
# Optional: an AcoustID application key, to recognise songs by their sound
# (needs Chromaprint's fpcalc: brew install chromaprint).
# acoustid_key = ""
