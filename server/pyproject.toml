[project]
name = "hive-server"
version = "0.1.0"
description = "Hive: a private, invite-only music server for one family."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "mutagen>=1.47",
  "pillow>=10.4",
  "watchdog>=5.0",
  "httpx>=0.27",  # online lookup (MusicBrainz, Cover Art Archive, Wikidata, AcoustID)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "httpx2",  # Starlette's test client prefers it
  "ruff>=0.6",
  "openapi-spec-validator>=0.7",
  "jsonschema>=4.22",
]

[project.scripts]
hive = "hive.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hive"]

# The contract lives at the repository root; ship a copy inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"../api/openapi.yaml" = "hive/openapi.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
