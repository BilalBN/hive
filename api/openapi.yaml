openapi: 3.1.0
info:
  title: Hive API
  version: 0.3.0
  summary: The private family music server's API.
  description: |
    This file is the single source of truth for every endpoint. The server is
    checked against it in tests, and the Dart (app) and TypeScript (admin)
    clients are generated from it.

    Every operation carries `x-milestone`: the build milestone that implements
    it. Until then the server answers `501 Not Implemented` with a Problem body.
    Response schemas marked `Pending` are filled in by their milestone.

    Live events (approval granted, device revoked, play-session changes) arrive
    over a WebSocket at `/api/v1/events` from M2; it is not described here
    because OpenAPI does not model WebSockets.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
tags:
  - name: system
    description: Health and server identity.
  - name: auth
    description: Invites, email codes, approval and device sessions.
  - name: library
    description: Albums, artists, tracks, search, playlists and likes.
  - name: media
    description: Streaming, artwork, lyrics and downloads.
  - name: listen
    description: Song recognition and song requests.
  - name: sync
    description: Play sessions for continuity across devices.
  - name: admin
    description: Hive Admin. Admin session required.

paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Server identity and health; used by apps to check "Connected to home".
      x-milestone: M0
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  # ---------------------------------------------------------------- auth (M2)
  /api/v1/auth/invites/resolve:
    post:
      tags: [auth]
      operationId: resolveInvite
      summary: Check an invite code from a QR or typed code, and show which home it belongs to.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InviteCode" } } }
      responses:
        "200": { description: The invite., content: { application/json: { schema: { $ref: "#/components/schemas/InviteInfo" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/auth/email/start:
    post:
      tags: [auth]
      operationId: startEmailVerification
      summary: Send a 6-digit code to an email address.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailStart" } } }
      responses:
        "200": { description: A code is on its way., content: { application/json: { schema: { $ref: "#/components/schemas/EmailStarted" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmailCode
      summary: Check the code; creates an access request (approved at once when invited or already a member).
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailVerify" } } }
      responses:
        "200": { description: The access request., content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestStatus" } } } }
        "400": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Expired" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/auth/requests/{requestId}:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    post:
      tags: [auth]
      operationId: getAccessRequest
      summary: Check on an access request while waiting for approval (POST so the token stays out of URLs).
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestPoll" } } }
      responses:
        "200": { description: The request., content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestStatus" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/devices:
    post:
      tags: [auth]
      operationId: registerDevice
      summary: Register this device's public key once approved; enforces the device limit.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeviceRegistration" } } }
      responses:
        "200": { description: Signed in., content: { application/json: { schema: { $ref: "#/components/schemas/DeviceSession" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DeviceLimit" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/auth/challenge:
    post:
      tags: [auth]
      operationId: createChallenge
      summary: Get a one-time challenge for the device to sign before refreshing.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeRequest" } } }
      responses:
        "200": { description: The challenge., content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/token:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Swap a refresh token plus a signed challenge for new tokens.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TokenRefresh" } } }
      responses:
        "200": { description: New tokens., content: { application/json: { schema: { $ref: "#/components/schemas/DeviceSession" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in person.
      x-milestone: M2
      responses:
        "200": { description: You., content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change your name or Simple mode.
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MeEdit" } } }
      responses:
        "200": { description: You., content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/me/devices:
    get:
      tags: [auth]
      operationId: listMyDevices
      summary: The signed-in person's devices (up to 4) and swaps left this month.
      x-milestone: M2
      responses:
        "200": { description: Your devices., content: { application/json: { schema: { $ref: "#/components/schemas/MyDevices" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/devices/{deviceId}:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    delete:
      tags: [auth]
      operationId: removeMyDevice
      summary: Remove one of your own devices (counts towards the monthly swap limit; this device signs out).
      x-milestone: M2
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------- library (M1)
  # Authorised by the device's access token (M2). Before the first admin is
  # set up, the home's development key from M1 still works.
  /api/v1/library/home:
    get:
      tags: [library]
      operationId: getHome
      summary: Shelves for the Home screen.
      x-milestone: M1
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200": { description: The Home screen., content: { application/json: { schema: { $ref: "#/components/schemas/Home" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/albums:
    get:
      tags: [library]
      operationId: listAlbums
      summary: Albums, paged, with sort and filters.
      x-milestone: M1
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: sort
          in: query
          schema: { type: string, enum: [recent, title, artist, year], default: recent }
          description: recent = newest additions first.
        - name: artistId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Language"
      responses:
        "200": { description: A page of albums., content: { application/json: { schema: { $ref: "#/components/schemas/AlbumPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/albums/{albumId}:
    parameters: [{ $ref: "#/components/parameters/AlbumId" }]
    get:
      tags: [library]
      operationId: getAlbum
      summary: One album with its tracks.
      x-milestone: M1
      responses:
        "200": { description: The album., content: { application/json: { schema: { $ref: "#/components/schemas/Album" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/library/artists:
    get:
      tags: [library]
      operationId: listArtists
      summary: Artists, paged.
      x-milestone: M1
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: A page of artists., content: { application/json: { schema: { $ref: "#/components/schemas/ArtistPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/artists/{artistId}:
    parameters: [{ $ref: "#/components/parameters/ArtistId" }]
    get:
      tags: [library]
      operationId: getArtist
      summary: One artist with albums and the person's most-played songs.
      x-milestone: M1
      responses:
        "200": { description: The artist., content: { application/json: { schema: { $ref: "#/components/schemas/Artist" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/library/tracks:
    get:
      tags: [library]
      operationId: listTracks
      summary: Songs, paged; also liked songs with a filter.
      x-milestone: M1
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: sort
          in: query
          schema: { type: string, enum: [recent, title, artist], default: title }
        - name: liked
          in: query
          schema: { type: boolean }
          description: Only the songs this person liked, most recently liked first.
        - $ref: "#/components/parameters/Language"
      responses:
        "200": { description: A page of songs., content: { application/json: { schema: { $ref: "#/components/schemas/TrackPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/tracks/{trackId}/next:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    get:
      tags: [library]
      operationId: songsToFollow
      summary: Songs to carry on with when the queue runs out (autoplay).
      description: The rest of the song's album, then the same singer, the same composer or film, the same language, then anything.
      x-milestone: M1.5
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: exclude
          in: query
          description: Ids of songs already in the queue, separated by commas.
          schema: { type: string, maxLength: 20000 }
        - $ref: "#/components/parameters/Language"
      responses:
        "200": { description: Songs to play next., content: { application/json: { schema: { $ref: "#/components/schemas/TrackPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/library/search:
    get:
      tags: [library]
      operationId: search
      summary: Instant search across songs, albums, artists and playlists.
      x-milestone: M1
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: |
            Words in any script; each word matches the start of a word (so "mal"
            finds "Malare"). Malayalam, Devanagari, Tamil, Telugu, Kannada and
            Bengali titles are also found by their English spelling ("malare"
            finds "മലരേ"). Matches film titles, cast, directors, music
            directors, singers, composers, lyricists and language names too.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: At most this many of each kind.
        - $ref: "#/components/parameters/Language"
      responses:
        "200": { description: Matches by kind., content: { application/json: { schema: { $ref: "#/components/schemas/SearchResults" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/suggest:
    get:
      tags: [library]
      operationId: suggest
      summary: Names to finish what's being typed in search (songs, albums, artists at home).
      x-milestone: M2
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/Language"
      responses:
        "200": { description: Suggestions., content: { application/json: { schema: { $ref: "#/components/schemas/Suggestions" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/languages:
    get:
      tags: [library]
      operationId: listLanguages
      summary: Languages that have music at home, for the language chips.
      x-milestone: M1.5
      responses:
        "200": { description: "Languages in use, most albums first.", content: { application/json: { schema: { $ref: "#/components/schemas/LanguageList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/library/playlists:
    get:
      tags: [library]
      operationId: listPlaylists
      summary: The person's playlists and the family's shared ones.
      x-milestone: M1
      responses:
        "200": { description: "Playlists, yours first.", content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [library]
      operationId: createPlaylist
      summary: Create a playlist, private or shared with the family.
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistCreate" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/library/playlists/{playlistId}:
    parameters: [{ $ref: "#/components/parameters/PlaylistId" }]
    get:
      tags: [library]
      operationId: getPlaylist
      summary: One playlist with its songs.
      x-milestone: M1
      responses:
        "200": { description: The playlist., content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [library]
      operationId: updatePlaylist
      summary: Rename, change cover or sharing.
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistUpdate" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [library]
      operationId: deletePlaylist
      summary: Delete a playlist you own.
      x-milestone: M1
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/library/playlists/{playlistId}/items:
    parameters: [{ $ref: "#/components/parameters/PlaylistId" }]
    put:
      tags: [library]
      operationId: setPlaylistItems
      summary: Replace the playlist's song order (add, remove, reorder).
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistItemsUpdate" } } }
      responses:
        "200": { description: The playlist with its new order., content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/library/likes/{trackId}:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    put:
      tags: [library]
      operationId: likeTrack
      summary: Like a song.
      x-milestone: M1
      responses:
        "204": { description: Liked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [library]
      operationId: unlikeTrack
      summary: Remove a like.
      x-milestone: M1
      responses:
        "204": { description: Unliked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------------- media (M1)
  /api/v1/media/tracks/{trackId}/stream:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    post:
      tags: [media]
      operationId: createStreamTicket
      summary: Get a short-lived signed URL for one song at a chosen quality.
      description: |
        Lossless sends the original file untouched. High and Data saver are
        Opus at 256 and 96 kbps, made once and cached; the first request for a
        song may take a few seconds while it is made. Ask for the next song
        ahead of time (purpose "prefetch") so gapless playback never waits.
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StreamRequest" } } }
      responses:
        "200": { description: Where to fetch the audio., content: { application/json: { schema: { $ref: "#/components/schemas/StreamTicket" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/media/stream/{ticket}:
    parameters:
      - { name: ticket, in: path, required: true, schema: { type: string } }
    get:
      tags: [media]
      operationId: streamAudio
      summary: The audio itself; supports HTTP range requests. Authorised by the ticket.
      x-milestone: M1
      security: []
      responses:
        "200": { description: Audio bytes., content: { audio/*: { schema: { type: string, format: binary } } } }
        "206": { description: Partial audio bytes., content: { audio/*: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "416": { description: The requested range is outside the file. }
  /api/v1/media/artwork/{artworkId}:
    parameters:
      - { name: artworkId, in: path, required: true, schema: { type: string } }
    get:
      tags: [media]
      operationId: getArtwork
      summary: Cover art, resized.
      x-milestone: M1
      parameters:
        - name: size
          in: query
          schema: { type: integer, enum: [96, 192, 300, 600, 1200], default: 600 }
          description: Longest side in pixels (never enlarged).
      responses:
        "200": { description: JPEG image., content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/media/tracks/{trackId}/lyrics:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    get:
      tags: [media]
      operationId: getLyrics
      summary: Synced or plain lyrics when the file has them.
      x-milestone: M1
      responses:
        "200": { description: 'The lyrics, or kind "none".', content: { application/json: { schema: { $ref: "#/components/schemas/Lyrics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/media/tracks/{trackId}/download:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    post:
      tags: [media]
      operationId: createDownloadTicket
      summary: Permission to keep a song offline, with a link to fetch it and its valid-until date.
      description: >-
        The device downloads the link, keeps the song encrypted, and may play it until
        validUntil without reaching home. Checking in (checkDownloads) moves the date on.
      x-milestone: M3
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DownloadRequest" } } }
      responses:
        "200": { description: The ticket., content: { application/json: { schema: { $ref: "#/components/schemas/DownloadTicket" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/media/downloads/check:
    post:
      tags: [media]
      operationId: checkDownloads
      summary: Check in with home; downloads stay playable for another 30 days, minus songs that left the library.
      x-milestone: M3
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TrackIds" } } }
      responses:
        "200": { description: How long downloads stay playable., content: { application/json: { schema: { $ref: "#/components/schemas/DownloadCheck" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -------------------------------------------------------------- listen (M3)
  /api/v1/listen/match:
    post:
      tags: [listen]
      operationId: matchClip
      summary: Match a short recording against the family library; the clip is deleted afterwards.
      description: >-
        Send 3 to 15 seconds of the microphone (WAV, M4A/AAC, Opus or MP3, up to 3 MB) as the
        body. Listen checks every couple of seconds as it listens, sending the most recent seconds
        each time; a match goes in the person's Listen history, and so does the last try (last=true)
        when nothing matched.
      x-milestone: M3
      parameters:
        - name: last
          in: query
          required: false
          description: False for the checks made while still listening; a miss then isn't kept.
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          audio/*: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { description: What it heard., content: { application/json: { schema: { $ref: "#/components/schemas/ListenResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/listen/history:
    get:
      tags: [listen]
      operationId: listListenHistory
      summary: The person's recognitions, labelled by source (library or Shazam).
      x-milestone: M3
      responses:
        "200": { description: "Newest first, up to 50.", content: { application/json: { schema: { $ref: "#/components/schemas/ListenHistory" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [listen]
      operationId: recordListenResult
      summary: Save a recognition made on the device by Shazam, so history covers both sources.
      x-milestone: M5
      requestBody: { $ref: "#/components/requestBodies/Pending" }
      responses: { "200": { $ref: "#/components/responses/Pending" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /api/v1/listen/requests:
    post:
      tags: [listen]
      operationId: createSongRequest
      summary: Ask the admin to add a song (from Listen or from a search with no results).
      x-milestone: M3
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SongRequestCreate" } } }
      responses:
        "200": { description: The request., content: { application/json: { schema: { $ref: "#/components/schemas/SongRequest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/listen/shazam-token:
    post:
      tags: [listen]
      operationId: createShazamToken
      summary: Short-lived Apple developer token for ShazamKit on Android.
      x-milestone: M5
      responses: { "200": { $ref: "#/components/responses/Pending" }, "501": { $ref: "#/components/responses/NotImplemented" } }

  # ---------------------------------------------------------------- sync (M4)
  /api/v1/sync/session:
    get:
      tags: [sync]
      operationId: getPlaySession
      summary: The person's live play session, for the continuity offer.
      x-milestone: M4
      responses: { "200": { $ref: "#/components/responses/Pending" }, "501": { $ref: "#/components/responses/NotImplemented" } }
    put:
      tags: [sync]
      operationId: updatePlaySession
      summary: Report play, pause, seek, skip or queue changes from the playing device.
      x-milestone: M4
      requestBody: { $ref: "#/components/requestBodies/Pending" }
      responses: { "200": { $ref: "#/components/responses/Pending" }, "501": { $ref: "#/components/responses/NotImplemented" } }

  # --------------------------------------------------------------- admin (M1+)
  /api/v1/admin/session:
    get:
      tags: [admin]
      operationId: adminGetSession
      summary: Whether this browser is signed in, on the home computer, or Hive needs its first admin.
      x-milestone: M2
      security: []
      responses:
        "200": { description: The session., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSession" } } } }
    delete:
      tags: [admin]
      operationId: adminSignOut
      summary: End the admin session.
      x-milestone: M2
      responses:
        "204": { description: Signed out. }
  /api/v1/admin/setup:
    post:
      tags: [admin]
      operationId: adminSetup
      summary: Create the first admin. Only on the home computer, and only once; the development key stops working.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminSetup" } } }
      responses:
        "200": { description: The session., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSession" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/session/email:
    post:
      tags: [admin]
      operationId: adminStartEmailSignIn
      summary: Email an admin a sign-in code. The answer is the same for any address.
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminEmailStart" } } }
      responses:
        "200": { description: A code is on its way if the address is an admin's., content: { application/json: { schema: { $ref: "#/components/schemas/EmailStarted" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/admin/session/email/verify:
    post:
      tags: [admin]
      operationId: adminVerifyEmailSignIn
      summary: Check the email code and the authenticator code, and start a session (cookie hive_admin).
      x-milestone: M2
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminEmailVerify" } } }
      responses:
        "200": { description: Signed in., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSession" } } } }
        "400": { $ref: "#/components/responses/WrongCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/Expired" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/v1/admin/session/passkey/options:
    post:
      tags: [admin]
      operationId: adminPasskeyOptions
      summary: Start a passkey sign-in or registration (needs HTTPS on the private network).
      x-milestone: M6
      security: []
      requestBody: { $ref: "#/components/requestBodies/Pending" }
      responses: { "200": { $ref: "#/components/responses/Pending" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /api/v1/admin/session/passkey/verify:
    post:
      tags: [admin]
      operationId: adminPasskeyVerify
      summary: Finish a passkey sign-in or registration.
      x-milestone: M6
      security: []
      requestBody: { $ref: "#/components/requestBodies/Pending" }
      responses: { "200": { $ref: "#/components/responses/Pending" }, "501": { $ref: "#/components/responses/NotImplemented" } }
  /api/v1/admin/me/authenticator:
    post:
      tags: [admin]
      operationId: adminStartAuthenticator
      summary: Start setting up an authenticator app (returns the secret and an otpauth link for a QR code).
      x-milestone: M2
      responses:
        "200": { description: The secret., content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticatorSetup" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [admin]
      operationId: adminConfirmAuthenticator
      summary: Confirm the authenticator with a code from it; it's required for signing in away from the home computer.
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticatorCode" } } }
      responses:
        "200": { description: The session., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSession" } } } }
        "400": { $ref: "#/components/responses/WrongCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      operationId: adminRemoveAuthenticator
      summary: Remove your authenticator (only on the home computer).
      x-milestone: M2
      responses:
        "200": { description: The session., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSession" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/overview:
    get:
      tags: [admin]
      operationId: adminGetOverview
      summary: Health cards, requests waiting and recent activity.
      x-milestone: M2
      responses:
        "200": { description: The overview., content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/requests:
    get:
      tags: [admin]
      operationId: adminListRequests
      summary: Access requests (waiting first, then recent decisions), and codes to pass on while email isn't set up.
      x-milestone: M2
      responses:
        "200": { description: Requests., content: { application/json: { schema: { $ref: "#/components/schemas/AdminRequests" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/requests/{requestId}/approve:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    post:
      tags: [admin]
      operationId: adminApproveRequest
      summary: Approve a request (undo allowed for 10 seconds).
      x-milestone: M2
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestDecision" } } }
      responses:
        "200": { description: The request., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccessRequest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/requests/{requestId}/decline:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    post:
      tags: [admin]
      operationId: adminDeclineRequest
      summary: Decline a request (undo allowed for 10 seconds).
      x-milestone: M2
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestDecision" } } }
      responses:
        "200": { description: The request., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccessRequest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/requests/{requestId}/undo:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    post:
      tags: [admin]
      operationId: adminUndoDecision
      summary: Undo an approval or decline made in the last 10 seconds.
      x-milestone: M2
      responses:
        "200": { description: 'The request, waiting again.', content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccessRequest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/invites:
    get:
      tags: [admin]
      operationId: adminListInvites
      summary: Invites not yet used.
      x-milestone: M2
      responses:
        "200": { description: Invites., content: { application/json: { schema: { $ref: "#/components/schemas/AdminInvites" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: adminCreateInvite
      summary: Create an invite; returns the Hive code and QR payload (shown once) plus the private-network invite link.
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InviteCreate" } } }
      responses:
        "200": { description: The invite., content: { application/json: { schema: { $ref: "#/components/schemas/AdminInvite" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/invites/{inviteId}:
    parameters:
      - { name: inviteId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: adminRevokeInvite
      summary: Cancel an unused invite.
      x-milestone: M2
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/people:
    get:
      tags: [admin]
      operationId: adminListPeople
      summary: Everyone with access, their devices used and status.
      x-milestone: M2
      responses:
        "200": { description: People., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPeople" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/people/{personId}:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: adminGetPerson
      summary: One person with devices, swaps used and activity.
      x-milestone: M2
      responses:
        "200": { description: The person., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPersonDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdatePerson
      summary: Rename, suspend or reinstate, change role, override the device limit, reset devices, set Simple mode.
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonEdit" } } }
      responses:
        "200": { description: The person., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPersonDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/devices:
    get:
      tags: [admin]
      operationId: adminListDevices
      summary: Every device across the family.
      x-milestone: M2
      responses:
        "200": { description: Devices., content: { application/json: { schema: { $ref: "#/components/schemas/AdminDevices" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/devices/{deviceId}/revoke:
    parameters: [{ $ref: "#/components/parameters/DeviceId" }]
    post:
      tags: [admin]
      operationId: adminRevokeDevice
      summary: Sign a device out and delete its downloads on next contact.
      x-milestone: M2
      responses:
        "200": { description: The device., content: { application/json: { schema: { $ref: "#/components/schemas/AdminDevice" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/library/imports:
    get:
      tags: [admin]
      operationId: adminListImports
      summary: Import queue and files that need attention.
      x-milestone: M1
      responses:
        "200": { description: Library status., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/imports/{importId}/ignore:
    parameters: [{ $ref: "#/components/parameters/ImportId" }]
    post:
      tags: [admin]
      operationId: adminIgnoreImport
      summary: Take a file off Needs attention or Duplicate copies. It comes back if the file changes.
      x-milestone: M1
      responses:
        "200": { description: Library status., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/library/imports/{importId}/delete-copy:
    parameters: [{ $ref: "#/components/parameters/ImportId" }]
    post:
      tags: [admin]
      operationId: adminDeleteCopy
      summary: Delete an exact copy of a song in the library from disk, after comparing the two files again.
      x-milestone: M1
      responses:
        "200": { description: Library status., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/library/imports/delete-copies:
    post:
      tags: [admin]
      operationId: adminDeleteCopies
      summary: Delete every exact copy listed under Duplicate copies, each compared again first.
      x-milestone: M1
      responses:
        "200": { description: Library status., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/scan:
    post:
      tags: [admin]
      operationId: adminStartScan
      summary: Rescan the music folders now.
      x-milestone: M1
      responses:
        "200": { description: Scan started (or already running)., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/lookup:
    get:
      tags: [admin]
      operationId: adminGetLookup
      summary: Online lookup of album details, art, language and film; its progress and matches to review.
      x-milestone: M1.5
      responses:
        "200": { description: Lookup status., content: { application/json: { schema: { $ref: "#/components/schemas/LookupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [admin]
      operationId: adminUpdateLookup
      summary: Turn online lookup on or off, or set an AcoustID key.
      x-milestone: M1.5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LookupSettings" } } }
      responses:
        "200": { description: Lookup status., content: { application/json: { schema: { $ref: "#/components/schemas/LookupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/library/lookup/retry:
    post:
      tags: [admin]
      operationId: adminRetryLookup
      summary: Look albums up again (the ones named, or every one that found nothing or failed).
      x-milestone: M1.5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LookupRetry" } } }
      responses:
        "200": { description: Lookup status., content: { application/json: { schema: { $ref: "#/components/schemas/LookupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/lookup/test-acoustid:
    post:
      tags: [admin]
      operationId: adminTestAcoustid
      summary: Fingerprint one song and ask AcoustID about it, to show the key and fpcalc work.
      x-milestone: M1.5
      responses:
        "200": { description: The result., content: { application/json: { schema: { $ref: "#/components/schemas/AcoustidTest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/tracks/{trackId}/lyrics:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    get:
      tags: [admin]
      operationId: adminGetLyrics
      summary: A song's lyrics as Hive shows them, and where they come from.
      x-milestone: M1.5
      responses:
        "200": { description: The lyrics., content: { application/json: { schema: { $ref: "#/components/schemas/AdminLyrics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: adminSetLyrics
      summary: Set a song's lyrics (plain, or timed LRC). They win over the file's own; empty goes back to them.
      x-milestone: M1.5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LyricsEdit" } } }
      responses:
        "200": { description: The lyrics., content: { application/json: { schema: { $ref: "#/components/schemas/AdminLyrics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/library/tracks/{trackId}/lyrics/find:
    parameters: [{ $ref: "#/components/parameters/TrackId" }]
    post:
      tags: [admin]
      operationId: adminFindLyrics
      summary: Ask LRCLIB for a song's lyrics, to check before saving. Nothing is saved.
      x-milestone: M1.5
      responses:
        "200": { description: What was found., content: { application/json: { schema: { $ref: "#/components/schemas/LyricsFound" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/library/tidy:
    get:
      tags: [admin]
      operationId: adminListTidy
      summary: Song titles with download clutter, each as before → after; and the ones already tidied.
      x-milestone: M2
      responses:
        "200": { description: Suggestions., content: { application/json: { schema: { $ref: "#/components/schemas/TidyList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: adminApplyTidy
      summary: Use the tidy names for these songs (what Hive shows; the files don't change).
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TrackIds" } } }
      responses:
        "200": { description: Suggestions left., content: { application/json: { schema: { $ref: "#/components/schemas/TidyList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/tidy/undo:
    post:
      tags: [admin]
      operationId: adminUndoTidy
      summary: Go back to the files' own titles for these songs.
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TrackIds" } } }
      responses:
        "200": { description: Suggestions., content: { application/json: { schema: { $ref: "#/components/schemas/TidyList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/albums:
    get:
      tags: [admin]
      operationId: adminListAlbums
      summary: Albums for checking and editing, with filters.
      x-milestone: M1.5
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: filter
          in: query
          schema: { type: string, enum: [all, review, noArt, noLanguage, notFound], default: all }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200": { description: A page of albums., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAlbumPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/library/albums/{albumId}:
    parameters: [{ $ref: "#/components/parameters/AlbumId" }]
    get:
      tags: [admin]
      operationId: adminGetAlbum
      summary: One album's details, where each came from, and any match waiting for review.
      x-milestone: M1.5
      responses:
        "200": { description: The album., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAlbum" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdateAlbum
      summary: Correct an album. What you set is kept through rescans and lookups.
      x-milestone: M1.5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AlbumEdit" } } }
      responses:
        "200": { description: The album., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAlbum" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/library/albums/{albumId}/artwork:
    parameters: [{ $ref: "#/components/parameters/AlbumId" }]
    put:
      tags: [admin]
      operationId: adminSetAlbumArtwork
      summary: Replace the album's cover with an image (JPEG, PNG or WebP, up to 20 MB).
      x-milestone: M1.5
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: The album., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAlbum" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/library/albums/{albumId}/match:
    parameters: [{ $ref: "#/components/parameters/AlbumId" }]
    post:
      tags: [admin]
      operationId: adminDecideMatch
      summary: Accept or reject the match found for an album.
      x-milestone: M1.5
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MatchDecision" } } }
      responses:
        "200": { description: The album., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAlbum" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Nothing is waiting for review on this album., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/admin/development-key:
    get:
      tags: [admin]
      operationId: adminGetDevelopmentKey
      summary: The temporary key the apps use until M2 (shown on Overview).
      x-milestone: M1
      responses:
        "200": { description: The key., content: { application/json: { schema: { $ref: "#/components/schemas/DevelopmentKey" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/uploads:
    post:
      tags: [admin]
      operationId: adminCreateUpload
      summary: Start a resumable upload (tus protocol; chunks go to the returned location).
      description: |
        tus 1.0 creation. Send `Tus-Resumable: 1.0.0`, `Upload-Length` and
        `Upload-Metadata` (base64 values: `filename`, optional `relativePath`
        for files inside a dropped folder). The response's `Location` is where
        chunks are sent with PATCH; HEAD there tells how much has arrived. When
        the last byte lands the file moves into the incoming folder and is
        scanned.
      x-milestone: M1
      parameters:
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: Upload-Metadata, in: header, schema: { type: string } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "201": { description: Created; see the Location header. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Larger than the upload limit. }
        "415": { description: Not an audio file Hive can play. }
  /api/v1/admin/uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    head:
      tags: [admin]
      operationId: adminGetUploadOffset
      summary: How many bytes of an upload have arrived (tus).
      x-milestone: M1
      responses:
        "200": { description: See the Upload-Offset and Upload-Length headers. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminAppendUpload
      summary: Send the next chunk of an upload (tus, application/offset+octet-stream).
      x-milestone: M1
      parameters:
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, minimum: 0 } }
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      requestBody:
        required: true
        content: { application/offset+octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Chunk saved; see Upload-Offset. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Upload-Offset doesn't match what has arrived. }
    delete:
      tags: [admin]
      operationId: adminCancelUpload
      summary: Cancel an upload and discard what has arrived (tus termination).
      x-milestone: M1
      responses:
        "204": { description: Cancelled. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/song-requests:
    get:
      tags: [admin]
      operationId: adminListSongRequests
      summary: Songs the family asked to add, from Listen or search.
      x-milestone: M3
      responses:
        "200": { description: "Waiting first, then recent.", content: { application/json: { schema: { $ref: "#/components/schemas/AdminSongRequests" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/song-requests/{songRequestId}:
    parameters:
      - { name: songRequestId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      operationId: adminUpdateSongRequest
      summary: Mark a song request added (the person sees it in Listen history) or dismissed.
      x-milestone: M3
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SongRequestDecision" } } }
      responses:
        "200": { description: The request., content: { application/json: { schema: { $ref: "#/components/schemas/SongRequest" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/recognition:
    get:
      tags: [admin]
      operationId: adminGetRecognition
      summary: Fingerprint coverage and matches this week by source.
      x-milestone: M3
      responses:
        "200": { description: Coverage and recent matches., content: { application/json: { schema: { $ref: "#/components/schemas/RecognitionStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/recognition/rebuild:
    post:
      tags: [admin]
      operationId: adminRebuildRecognition
      summary: Fingerprint every song again from scratch (in the background).
      x-milestone: M3
      responses:
        "200": { description: Coverage now., content: { application/json: { schema: { $ref: "#/components/schemas/RecognitionStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      summary: Server settings.
      x-milestone: M2
      responses:
        "200": { description: Settings., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [admin]
      operationId: adminUpdateSettings
      summary: Change server settings.
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettingsEdit" } } }
      responses:
        "200": { description: Settings., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/settings/email/test:
    post:
      tags: [admin]
      operationId: adminTestEmail
      summary: Send a test email with the saved settings.
      x-milestone: M2
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailTest" } } }
      responses:
        "200": { description: What happened., content: { application/json: { schema: { $ref: "#/components/schemas/EmailTestResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      summary: Every admin action and sign-in, newest first.
      x-milestone: M2
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          description: Only this kind of action (e.g. "request.approve").
          schema: { type: string, maxLength: 64 }
      responses:
        "200": { description: A page of the log., content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/backups:
    get:
      tags: [admin]
      operationId: adminListBackups
      summary: Backup schedule, destination and the backups there.
      x-milestone: M4
      responses:
        "200": { description: The backups., content: { application/json: { schema: { $ref: "#/components/schemas/BackupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: adminRunBackup
      summary: Back up now.
      x-milestone: M4
      responses:
        "200": { description: The backup made., content: { application/json: { schema: { $ref: "#/components/schemas/Backup" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: A backup is already being made., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/backups/settings:
    put:
      tags: [admin]
      operationId: adminBackupSettings
      summary: Where backups go, whether the daily one runs, when, and how many to keep.
      x-milestone: M4
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BackupSettings" } } }
      responses:
        "200": { description: The backups., content: { application/json: { schema: { $ref: "#/components/schemas/BackupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/backups/restore:
    delete:
      tags: [admin]
      operationId: adminCancelRestore
      summary: Don't restore at the next start after all.
      x-milestone: M4
      responses:
        "200": { description: The backups., content: { application/json: { schema: { $ref: "#/components/schemas/BackupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/backups/{backupId}/restore:
    parameters:
      - { name: backupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminRestoreBackup
      summary: Restore a backup at the next start, re-applying sign-outs and pauses made after it.
      description: >-
        Backs up today's state first, so the restore can be undone. The backup is put in place
        when Hive next starts, before anything opens the database.
      x-milestone: M4
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/BackupRestore" } } }
      responses:
        "200": { description: "The backups, with the restore waiting.", content: { application/json: { schema: { $ref: "#/components/schemas/BackupStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/admin/backups/{backupId}:
    parameters:
      - { name: backupId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: adminDeleteBackup
      summary: Delete a backup file.
      x-milestone: M4
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/logs:
    get:
      tags: [admin]
      operationId: adminGetLogs
      summary: Recent server log lines, newest first, with level, area and text filters.
      x-milestone: M4
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [DEBUG, INFO, WARNING, ERROR], default: INFO }, description: This level and above. }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: area, in: query, schema: { type: string, maxLength: 24 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 300 } }
      responses:
        "200": { description: The lines., content: { application/json: { schema: { $ref: "#/components/schemas/LogPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/logs/file:
    get:
      tags: [admin]
      operationId: adminDownloadLog
      summary: The server's log file, to download.
      x-milestone: M4
      responses:
        "200": { description: The log., content: { text/plain: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/system:
    get:
      tags: [admin]
      operationId: adminSystemHealth
      summary: How the home computer is doing - disks, backups, uptime, devices on old apps.
      x-milestone: M4
      responses:
        "200": { description: The report., content: { application/json: { schema: { $ref: "#/components/schemas/SystemHealth" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Short-lived access token for a registered device (from M2).
    adminSession:
      type: apiKey
      in: cookie
      name: hive_admin
      description: Admin browser session (from M2).

  parameters:
    Language:
      name: language
      in: query
      schema: { type: string, pattern: "^[a-z]{2,3}$" }
      description: Only music in this language (a code from listLanguages, e.g. "ml").
    RequestId: { name: requestId, in: path, required: true, schema: { type: string } }
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string } }
    AlbumId: { name: albumId, in: path, required: true, schema: { type: string } }
    ArtistId: { name: artistId, in: path, required: true, schema: { type: string } }
    TrackId: { name: trackId, in: path, required: true, schema: { type: string } }
    ImportId: { name: importId, in: path, required: true, schema: { type: string } }
    PlaylistId: { name: playlistId, in: path, required: true, schema: { type: string } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }

  requestBodies:
    Pending:
      description: Body defined by the operation's milestone.
      required: false
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Pending" }

  responses:
    Unauthorized:
      description: Missing or wrong key (M1) or token (from M2).
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Not allowed, for example someone else's playlist or an expired stream ticket.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: No such thing.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Invalid:
      description: The request body or parameters are wrong.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    WrongCode:
      description: 'The code is wrong; the Problem has attemptsLeft.'
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Expired:
      description: The code has expired; ask for a new one.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    TooMany:
      description: Too many tries or codes; the detail says when to try again.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    DeviceLimit:
      description: 'All devices are in use; the Problem has code "deviceLimit", devices (MyDevice list) and swapsLeft.'
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Can't be done in the current state; the detail says why.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    TooLarge:
      description: The upload is bigger than this operation takes.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unavailable:
      description: Temporarily can't do it (for example FFmpeg is missing for a lossy quality).
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Pending:
      description: Response defined by the operation's milestone.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Pending" }
    NotImplemented:
      description: Not built yet; `milestone` says when it will be.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Health:
      type: object
      required: [status, homeName, serverVersion, apiVersion, serverTime]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always "ok" when the server answers.
        homeName:
          type: string
          description: What the family sees as the home, e.g. "Arun's home".
          examples: ["Arun's home"]
        serverVersion:
          type: string
          examples: ["0.1.0"]
        apiVersion:
          type: string
          description: Version of this contract the server implements.
          examples: ["0.1.0"]
        minAppVersion:
          type: string
          description: Older apps show "Time for an update".
          examples: ["0.1.0"]
        access:
          type: string
          enum: [developmentKey, invites]
          description: How apps get in. developmentKey until the first admin is set up (M1's key), then invites and email codes.
        serverTime:
          type: string
          format: date-time
          description: The server's clock; apps measure their offset from it.
    Problem:
      type: object
      description: Error body (RFC 9457 problem details).
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        milestone:
          type: string
          description: For 501 responses, the milestone that builds this operation.
        code:
          type: string
          description: 'A machine-readable reason: deviceLimit, swapLimit, suspended, revoked, signInNeeded, authenticatorNeeded, expired, tooMany.'
        attemptsLeft: { type: integer, description: For a wrong code. }
        retryAfterSeconds: { type: integer }
        devices: { type: array, description: For deviceLimit., items: { $ref: "#/components/schemas/MyDevice" } }
        swapsLeft: { type: integer, description: For deviceLimit. }
    # --------------------------------------------------------- library (M1)
    AudioFormat:
      type: object
      description: What a file or stream is, and how the app labels it.
      required: [codec, lossless, sampleRate, channels, tier, label]
      properties:
        codec:
          type: string
          enum: [flac, alac, wav, aiff, mp3, aac, vorbis, opus]
        lossless: { type: boolean }
        sampleRate: { type: integer, examples: [44100, 96000] }
        bitDepth: { type: integer, description: Lossless only., examples: [16, 24] }
        bitrateKbps: { type: integer, description: Average bitrate. }
        channels: { type: integer }
        tier:
          type: string
          enum: [hires, lossless, lossy]
          description: hires = lossless above 16-bit or above 48 kHz.
        label:
          type: string
          description: Short badge text.
          examples: ["Hi-Res 24/96", "Lossless 16/44.1", "MP3 320"]
    TrackSummary:
      type: object
      required: [id, title, artistName, albumId, albumTitle, durationMs, format, liked]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artistName:
          type: string
          description: Everyone credited, as it should be shown ("Mithoon, Jeet Gannguli").
        albumId: { type: string }
        albumTitle: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        durationMs: { type: integer }
        artworkId: { type: string }
        format: { $ref: "#/components/schemas/AudioFormat" }
        liked: { type: boolean }
        hasLyrics: { type: boolean }
        composer: { type: string, description: 'Who wrote the music, as credited.' }
        lyricist: { type: string, description: 'Who wrote the words, as credited.' }
    AlbumSummary:
      type: object
      required: [id, title, artistName, trackCount, tier, addedAt]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artistName: { type: string }
        year: { type: integer }
        artworkId: { type: string }
        trackCount: { type: integer }
        tier:
          type: string
          enum: [hires, lossless, lossy]
          description: The best quality on the album.
        addedAt: { type: string, format: date-time }
        language: { type: string, description: Language code (e.g. "ml"); missing when not known. }
        kind: { $ref: "#/components/schemas/AlbumKind" }
        filmTitle: { type: string, description: 'The film, for soundtracks (often the album title).' }
    AlbumKind:
      type: string
      enum: [album, soundtrack, compilation, single, ep, live, other]
    Album:
      type: object
      required: [id, title, artistName, trackCount, tier, addedAt, durationMs, tracks]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artistName: { type: string }
        year: { type: integer }
        artworkId: { type: string }
        trackCount: { type: integer }
        tier: { type: string, enum: [hires, lossless, lossy] }
        addedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        genre: { type: string }
        language: { type: string }
        kind: { $ref: "#/components/schemas/AlbumKind" }
        filmTitle: { type: string }
        film: { $ref: "#/components/schemas/Film" }
        credits:
          type: array
          description: Music directors, composers and lyricists of the album; cast and director of its film.
          items: { $ref: "#/components/schemas/Credit" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackSummary" }
    ArtistSummary:
      type: object
      required: [id, name, albumCount, trackCount]
      properties:
        id: { type: string }
        name: { type: string }
        artworkId: { type: string, description: The cover of one of their albums. }
        albumCount: { type: integer }
        trackCount: { type: integer }
    Artist:
      type: object
      required: [id, name, albumCount, trackCount, albums, topTracks]
      properties:
        id: { type: string }
        name: { type: string }
        artworkId: { type: string }
        albumCount: { type: integer }
        trackCount: { type: integer }
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumSummary" }
        topTracks:
          type: array
          description: This person's most-played songs by the artist, then the rest by album order.
          items: { $ref: "#/components/schemas/TrackSummary" }
        roles:
          type: array
          description: What they do at home, most first (singer, musicDirector, actor…).
          items: { $ref: "#/components/schemas/CreditRole" }
        musicFor:
          type: array
          description: Albums they composed or were music director for.
          items: { $ref: "#/components/schemas/AlbumSummary" }
        films:
          type: array
          description: Soundtracks of films they acted in or directed.
          items: { $ref: "#/components/schemas/AlbumSummary" }
        lyricsFor:
          type: array
          description: Songs they wrote the words for.
          items: { $ref: "#/components/schemas/TrackSummary" }
    CreditRole:
      type: string
      enum: [singer, composer, lyricist, musicDirector, actor, director]
    Credit:
      type: object
      required: [role, name]
      properties:
        role: { $ref: "#/components/schemas/CreditRole" }
        name: { type: string }
        artistId: { type: string, description: Their page at home. }
    Film:
      type: object
      required: [title]
      properties:
        title: { type: string }
        year: { type: integer }
        wikidataId: { type: string, examples: ["Q19893435"] }
    Language:
      type: object
      required: [code, name, nativeName, albumCount]
      properties:
        code: { type: string, examples: ["ml"] }
        name: { type: string, examples: ["Malayalam"] }
        nativeName: { type: string, examples: ["മലയാളം"] }
        albumCount: { type: integer }
    LanguageList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Language" } }
    AlbumPage:
      type: object
      required: [items, total, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AlbumSummary" } }
        total: { type: integer }
        offset: { type: integer }
    ArtistPage:
      type: object
      required: [items, total, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ArtistSummary" } }
        total: { type: integer }
        offset: { type: integer }
    TrackPage:
      type: object
      required: [items, total, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TrackSummary" } }
        total: { type: integer }
        offset: { type: integer }
    HomeTile:
      type: object
      description: A tile in "Jump back in".
      required: [kind, id, title]
      properties:
        kind: { type: string, enum: [album, playlist, artist, liked] }
        id: { type: string, description: 'The album, playlist or artist; "liked" for liked songs.' }
        title: { type: string }
        subtitle: { type: string }
        artworkIds:
          type: array
          description: One cover, or up to four for a playlist mosaic.
          items: { type: string }
    Home:
      type: object
      required: [jumpBackIn, newAtHome, playlists, libraryEmpty]
      properties:
        jumpBackIn:
          type: array
          description: Up to 6 things this person played recently.
          items: { $ref: "#/components/schemas/HomeTile" }
        newAtHome:
          type: array
          description: Albums added most recently.
          items: { $ref: "#/components/schemas/AlbumSummary" }
        playlists:
          type: array
          items: { $ref: "#/components/schemas/PlaylistSummary" }
        libraryEmpty:
          type: boolean
          description: Nothing has been added at home yet.
        recentlyPlayed:
          type: array
          description: Up to 12 songs this person played, newest first.
          items: { $ref: "#/components/schemas/TrackSummary" }
        onRepeat:
          type: array
          description: Up to 12 songs this person plays most (three plays or more).
          items: { $ref: "#/components/schemas/TrackSummary" }
        forYou:
          type: array
          description: Up to 12 albums picked for this person (their singers and languages first, not played lately); a new mix each day.
          items: { $ref: "#/components/schemas/AlbumSummary" }
        films:
          type: array
          description: Up to 12 film soundtracks, a new mix each day.
          items: { $ref: "#/components/schemas/AlbumSummary" }
        artists:
          type: array
          description: Up to 12 artists, the ones this person plays most first.
          items: { $ref: "#/components/schemas/ArtistSummary" }
    SearchResults:
      type: object
      required: [tracks, albums, artists, playlists]
      properties:
        top:
          type: object
          description: The single best match, when one stands out.
          required: [kind, id]
          properties:
            kind: { type: string, enum: [track, album, artist, playlist] }
            id: { type: string }
        tracks: { type: array, items: { $ref: "#/components/schemas/TrackSummary" } }
        albums: { type: array, items: { $ref: "#/components/schemas/AlbumSummary" } }
        artists: { type: array, items: { $ref: "#/components/schemas/ArtistSummary" } }
        playlists: { type: array, items: { $ref: "#/components/schemas/PlaylistSummary" } }
    PlaylistSummary:
      type: object
      required: [id, name, ownerName, mine, shared, trackCount, durationMs, artworkIds, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerName: { type: string }
        mine: { type: boolean, description: This person can edit and delete it. }
        shared: { type: boolean, description: The whole family can see and play it. }
        trackCount: { type: integer }
        durationMs: { type: integer }
        artworkIds:
          type: array
          description: Covers of up to four different albums in it, for the mosaic.
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    PlaylistItem:
      type: object
      required: [itemId, track, addedAt]
      properties:
        itemId: { type: string }
        track: { $ref: "#/components/schemas/TrackSummary" }
        addedAt: { type: string, format: date-time }
    Playlist:
      type: object
      required: [id, name, ownerName, mine, shared, trackCount, durationMs, artworkIds, updatedAt, items]
      properties:
        id: { type: string }
        name: { type: string }
        ownerName: { type: string }
        mine: { type: boolean }
        shared: { type: boolean }
        trackCount: { type: integer }
        durationMs: { type: integer }
        artworkIds: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/PlaylistItem" } }
    PlaylistList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlaylistSummary" } }
    PlaylistCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        shared: { type: boolean, default: false }
        trackIds:
          type: array
          description: Songs to start with, in order.
          items: { type: string }
    PlaylistUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        shared: { type: boolean }
    PlaylistItemsUpdate:
      type: object
      required: [trackIds]
      properties:
        trackIds:
          type: array
          description: The whole new order; a song may appear more than once.
          maxItems: 5000
          items: { type: string }

    # ----------------------------------------------------------- media (M1)
    StreamRequest:
      type: object
      required: [quality]
      properties:
        quality:
          type: string
          enum: [lossless, high, dataSaver]
          description: lossless = the original file; high = 256 kbps; dataSaver = 96 kbps (Opus, or AAC for Apple's player). A lossy original small enough is sent as it is.
        player:
          type: string
          enum: [apple, other]
          default: other
          description: |
            Which audio engine will play it. Apple's player gets High and Data
            saver as AAC in MP4 (it can't stream Opus) and ALAC as it is;
            others get Opus in Ogg, and ALAC or AIFF originals as FLAC
            (bit-identical, so still lossless).
        context:
          $ref: "#/components/schemas/PlayContext"
        purpose:
          type: string
          enum: [play, prefetch]
          default: play
          description: play counts towards this person's recently played; prefetch doesn't.
    PlayContext:
      type: object
      description: Where the song was started from; feeds "Jump back in" on Home.
      required: [kind, id]
      properties:
        kind: { type: string, enum: [album, playlist, artist, liked] }
        id: { type: string }
    Loudness:
      type: object
      description: EBU R128 measurement of the original, for volume levelling.
      required: [integratedLufs, truePeakDbtp]
      properties:
        integratedLufs: { type: number, examples: [-9.4] }
        truePeakDbtp: { type: number, examples: [0.6] }
        albumLufs: { type: number, description: 'The whole album, for album-mode levelling.' }
    StreamTicket:
      type: object
      required: [url, expiresAt, format, mimeType, durationMs, transcoded]
      properties:
        url:
          type: string
          description: Path on this server; fetch it with no auth header. Range requests work.
          examples: ["/api/v1/media/stream/eyJ0Ijoi..."]
        expiresAt: { type: string, format: date-time }
        format: { $ref: "#/components/schemas/AudioFormat" }
        source:
          $ref: "#/components/schemas/AudioFormat"
        mimeType: { type: string, examples: ["audio/flac", "audio/ogg", "audio/mp4"] }
        sizeBytes: { type: integer }
        durationMs: { type: integer }
        transcoded: { type: boolean, description: False when the original file is sent untouched. }
        loudness: { $ref: "#/components/schemas/Loudness" }
    LyricsLine:
      type: object
      required: [text]
      properties:
        timeMs: { type: integer, description: Synced lyrics only. }
        text: { type: string }
    Lyrics:
      type: object
      required: [kind, lines]
      properties:
        kind: { type: string, enum: [synced, plain, none] }
        lines: { type: array, items: { $ref: "#/components/schemas/LyricsLine" } }

    # ----------------------------------------------------------- listen and downloads (M3)
    ListenResult:
      type: object
      required: [matched, source]
      properties:
        id: { type: integer, description: "The history entry; absent for an in-between check that found nothing (not kept)." }
        matched: { type: boolean }
        source: { type: string, enum: [library, shazam] }
        track: { $ref: "#/components/schemas/TrackSummary" }
        positionMs:
          type: integer
          description: Where the song is now (the clip's start plus its length), for "Play from 1:42".
        confidence: { type: number, minimum: 0, maximum: 1 }
        title: { type: string, description: "M5: what Shazam called a song that isn't at home." }
        artist: { type: string, description: "M5: who Shazam says sings it." }
    ListenEvent:
      type: object
      required: [id, at, source, matched]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        source: { type: string, enum: [library, shazam] }
        matched: { type: boolean }
        track: { $ref: "#/components/schemas/TrackSummary" }
        positionMs: { type: integer }
        title: { type: string, description: What Shazam called a song that isn't at home (M5). }
        artist: { type: string }
        requested: { type: boolean, description: Asked the admin to add it. }
    ListenHistory:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ListenEvent" } }
    SongRequestCreate:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [listen, search] }
        title: { type: string, maxLength: 512 }
        artist: { type: string, maxLength: 512 }
        note: { type: string, maxLength: 500 }
        listenEventId: { type: integer, description: The Listen attempt it came from, if any. }
    SongRequest:
      type: object
      required: [id, at, source, status]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        source: { type: string, enum: [listen, search] }
        status: { type: string, enum: [waiting, added, dismissed] }
        title: { type: string }
        artist: { type: string }
        note: { type: string }
        heardAt: { type: string, format: date-time, description: When Listen heard it. }
        personName: { type: string, description: Who asked (admin view). }
        decidedAt: { type: string, format: date-time }
    SongRequestDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [waiting, added, dismissed] }
    AdminSongRequests:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SongRequest" } }
    LogLine:
      type: object
      required: [id, at, level, area, text]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        level: { type: string, enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL] }
        area: { type: string, description: "The part of the server: auth, scan, stream, backups…" }
        text: { type: string }
    LogPage:
      type: object
      required: [items, areas]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        areas: { type: array, items: { type: string } }
    DiskSpace:
      type: object
      required: [label, path, freeBytes, totalBytes, level]
      properties:
        label: { type: string }
        path: { type: string }
        freeBytes: { type: integer }
        totalBytes: { type: integer }
        level: { type: string, enum: [ok, low, full] }
    HealthProblem:
      type: object
      required: [key, level, text]
      properties:
        key: { type: string }
        level: { type: string, enum: [problem, warning, info] }
        text: { type: string }
    SystemHealth:
      type: object
      required: [serverVersion, startedAt, uptimeSeconds, system, python, packaged, dataFolder, databaseBytes, disks, minAppVersion, devices, devicesOnOldApps, errorsToday, warningsToday, ffmpeg, problems]
      properties:
        serverVersion: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        system: { type: string }
        python: { type: string }
        packaged: { type: boolean, description: Installed from the installer (not run from the code). }
        dataFolder: { type: string }
        databaseBytes: { type: integer }
        disks: { type: array, items: { $ref: "#/components/schemas/DiskSpace" } }
        minAppVersion: { type: string }
        devices: { type: integer }
        devicesOnOldApps: { type: integer }
        errorsToday: { type: integer }
        warningsToday: { type: integer }
        ffmpeg: { type: boolean }
        lastBackupAt: { type: string, format: date-time }
        problems: { type: array, items: { $ref: "#/components/schemas/HealthProblem" } }
    Backup:
      type: object
      required: [id, at, sizeBytes, kind, serverVersion, people, tracks, musicFolders]
      properties:
        id: { type: string, description: The file name. }
        at: { type: string, format: date-time }
        sizeBytes: { type: integer }
        kind: { type: string, enum: [manual, scheduled, before-restore, before-update] }
        serverVersion: { type: string }
        people: { type: integer }
        tracks: { type: integer }
        musicFolders: { type: array, items: { type: string }, description: The music folders on the computer that made it. }
    BackupRestore:
      type: object
      additionalProperties: false
      properties:
        folders:
          type: array
          maxItems: 20
          description: "Moving to another computer: where each music folder of the backup is now. Songs keep their likes, plays and playlists."
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: { type: string, maxLength: 1024 }
              to: { type: string, maxLength: 1024 }
    BackupSettings:
      type: object
      additionalProperties: false
      properties:
        folder: { type: string, maxLength: 1024, description: "Full path, e.g. a folder on the backup drive." }
        enabled: { type: boolean, description: The daily backup. }
        time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "Local time, e.g. 03:00." }
        keep: { type: integer, minimum: 1, maximum: 90, description: How many daily and manual backups to keep. }
    BackupStatus:
      type: object
      required: [folder, enabled, time, keep, running, items]
      properties:
        folder: { type: string }
        enabled: { type: boolean }
        time: { type: string }
        keep: { type: integer }
        running: { type: boolean }
        lastAt: { type: string, format: date-time }
        lastError: { type: string, description: Why the last backup failed. }
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        pendingRestore:
          type: object
          description: A restore waiting for Hive to restart.
          required: [id, backupAt, stagedAt]
          properties:
            id: { type: string }
            backupAt: { type: string, format: date-time }
            stagedAt: { type: string, format: date-time }
        restored:
          type: object
          description: The last backup restored, and when.
          required: [id, at]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
    RecognitionStatus:
      type: object
      required: [tracks, fingerprinted, waiting, working, failed, ffmpeg, matchesThisWeek, noMatchThisWeek]
      properties:
        tracks: { type: integer }
        fingerprinted: { type: integer }
        waiting: { type: integer }
        working: { type: boolean }
        failed: { type: integer, description: Songs that couldn't be fingerprinted (silent or unreadable). }
        landmarks: { type: integer }
        ffmpeg: { type: boolean, description: Listen needs FFmpeg on the home PC. }
        rebuiltAt: { type: string, format: date-time }
        matchesThisWeek: { type: integer }
        noMatchThisWeek: { type: integer }
        shazamThisWeek: { type: integer, description: M5. }
        requestsWaiting: { type: integer }
    DownloadRequest:
      type: object
      required: [quality]
      properties:
        quality: { type: string, enum: [lossless, high, dataSaver] }
        player: { type: string, enum: [apple, other], default: other }
    DownloadTicket:
      type: object
      description: A stream ticket (see StreamTicket) plus how long the song may stay offline.
      required: [url, expiresAt, format, mimeType, durationMs, transcoded, validUntil]
      properties:
        url: { type: string, description: Path on this server; fetch it with no auth header. }
        expiresAt: { type: string, format: date-time, description: When the link stops working. }
        format: { $ref: "#/components/schemas/AudioFormat" }
        source: { $ref: "#/components/schemas/AudioFormat" }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: integer }
        transcoded: { type: boolean }
        loudness: { $ref: "#/components/schemas/Loudness" }
        validUntil:
          type: string
          format: date-time
          description: Plays offline until then; checking in with home moves it on.
    DownloadCheck:
      type: object
      required: [validUntil, gone]
      properties:
        validUntil: { type: string, format: date-time }
        gone:
          type: array
          items: { type: string }
          description: Songs no longer at home; the device deletes them.

    # ----------------------------------------------------------- admin (M1)
    ImportItem:
      type: object
      required: [id, path, status, updatedAt]
      properties:
        id: { type: string }
        path: { type: string, description: Relative to its music folder. }
        status:
          type: string
          enum: [queued, working, done, failed, duplicate, ignored]
          description: duplicate = an exact copy of a song already in the library, so it was skipped.
        problem: { type: string, description: 'Plain words, for files that need attention.' }
        updatedAt: { type: string, format: date-time }
    MusicFolder:
      type: object
      required: [path, exists, trackCount]
      properties:
        path: { type: string }
        exists: { type: boolean }
        trackCount: { type: integer }
    LibraryStatus:
      type: object
      required: [tracks, albums, artists, sizeBytes, scanning, queued, folders, uploadFolder, queue, needsAttention]
      properties:
        tracks: { type: integer }
        albums: { type: integer }
        artists: { type: integer }
        sizeBytes: { type: integer, description: Original files on disk. }
        hoursOfMusic: { type: number }
        scanning: { type: boolean }
        queued: { type: integer }
        lastScanAt: { type: string, format: date-time }
        folders: { type: array, items: { $ref: "#/components/schemas/MusicFolder" } }
        uploadFolder: { type: string, description: Where browser uploads are saved. }
        ffmpeg: { type: boolean, description: 'FFmpeg was found; without it High, Data saver and loudness are unavailable.' }
        queue:
          type: array
          description: Up to 50 files waiting or being read.
          items: { $ref: "#/components/schemas/ImportItem" }
        needsAttention:
          type: array
          items: { $ref: "#/components/schemas/ImportItem" }
        duplicates:
          type: array
          description: Exact copies of songs already in the library (up to 500). Not a problem; they can be deleted.
          items: { $ref: "#/components/schemas/ImportItem" }
        recentlyAdded:
          type: array
          description: Up to 10 albums added most recently.
          items: { $ref: "#/components/schemas/AlbumSummary" }
    LookupSettings:
      type: object
      properties:
        enabled: { type: boolean, description: Look up details of new and changed albums online. }
        acoustidKey:
          type: string
          maxLength: 64
          description: Optional AcoustID application key; lets Hive recognise songs with no useful tags by their sound. Empty removes it.
    LookupRetry:
      type: object
      properties:
        albumIds: { type: array, items: { type: string }, maxItems: 500 }
        all: { type: boolean, description: Every album that found nothing or failed. }
    LookupStatus:
      type: object
      required: [enabled, acoustidKey, working, waiting, found, notFound, review, failed, edited]
      properties:
        enabled: { type: boolean }
        acoustidKey: { type: boolean, description: A key is set (it's never sent back). }
        fingerprinting: { type: boolean, description: 'fpcalc (Chromaprint) was found, so fingerprints can be made.' }
        working: { type: boolean }
        waiting: { type: integer }
        found: { type: integer }
        notFound: { type: integer }
        review: { type: integer }
        failed: { type: integer }
        edited: { type: integer, description: Albums you corrected by hand. }
        soundMatches: { type: integer, description: Albums recognised by the sound of their songs (AcoustID). }
        acoustidProblem: { type: string, description: 'Why AcoustID turned Hive down last time, in plain words.' }
        acoustidUsedAt: { type: string, format: date-time, description: When AcoustID last answered. }
        lastError: { type: string, description: 'Why the last lookup failed, in plain words.' }
        sends:
          type: string
          description: What leaves home, in plain words, for the admin panel to show.
    AdminLyrics:
      type: object
      required: [text, source, kind, fileHasLyrics]
      properties:
        text: { type: string, description: The lyrics as Hive shows them (LRC when timed); empty when there are none. }
        source:
          type: string
          enum: [admin, file, online, none]
          description: admin = set in Hive Admin; file = the song's tags or .lrc file; online = found on LRCLIB.
        kind: { type: string, enum: [synced, plain, none] }
        fileHasLyrics: { type: boolean, description: The file has lyrics of its own (shown again if the admin's are removed). }
    LyricsEdit:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 100000
          description: 'Plain lines, or timed LRC such as "[01:23.45] a line". Empty removes the lyrics set in Hive Admin.'
    LyricsFound:
      type: object
      required: [found, message]
      properties:
        found: { type: boolean }
        text: { type: string }
        kind: { type: string, enum: [synced, plain] }
        message: { type: string, description: 'What happened, in plain words.' }
    AcoustidTest:
      type: object
      required: [ok, message, status]
      properties:
        ok: { type: boolean }
        message: { type: string, description: 'What happened, in plain words.' }
        status: { $ref: "#/components/schemas/LookupStatus" }
    LookupState:
      type: string
      enum: ["off", waiting, working, found, review, notFound, failed, edited]
    FoundAlbum:
      type: object
      required: [title, artistName, score, source]
      properties:
        title: { type: string }
        artistName: { type: string }
        year: { type: integer }
        language: { type: string }
        kind: { $ref: "#/components/schemas/AlbumKind" }
        filmTitle: { type: string }
        film: { $ref: "#/components/schemas/Film" }
        credits: { type: array, items: { $ref: "#/components/schemas/Credit" } }
        artworkId: { type: string, description: 'The cover it found, already saved at home.' }
        trackCount: { type: integer }
        score: { type: number, minimum: 0, maximum: 1, description: How sure the match is. }
        source: { type: string, description: 'Where it came from, e.g. "MusicBrainz · Wikidata".' }
        link: { type: string, description: 'The page on MusicBrainz or Wikidata, to check by eye.' }
    AdminAlbum:
      type: object
      required: [album, lookup, edited, sources]
      properties:
        album: { $ref: "#/components/schemas/Album" }
        lookup: { $ref: "#/components/schemas/LookupState" }
        lookupNote: { type: string, description: What the lookup did or why it found nothing. }
        found: { $ref: "#/components/schemas/FoundAlbum" }
        edited:
          type: array
          description: Fields you set by hand; rescans and lookups leave them alone.
          items: { type: string, enum: [title, artistName, year, language, filmTitle, filmYear, artwork] }
        sources:
          type: object
          description: Where each detail came from (tags, folder, script, lookup, you).
          additionalProperties: { type: string }
        folder: { type: string, description: 'Where its files are, relative to the music folder.' }
    AdminAlbumPage:
      type: object
      required: [items, total, offset]
      properties:
        items:
          type: array
          items:
            type: object
            required: [album, lookup]
            properties:
              album: { $ref: "#/components/schemas/AlbumSummary" }
              lookup: { $ref: "#/components/schemas/LookupState" }
              lookupNote: { type: string }
              found:
                $ref: "#/components/schemas/FoundAlbum"
                description: For albums to check, what the lookup found, so it can be approved from the list.
        total: { type: integer }
        offset: { type: integer }
    AlbumEdit:
      type: object
      description: Set a field to change it; set it to null to go back to what the files and lookup say.
      properties:
        title: { type: [string, "null"], minLength: 1, maxLength: 512 }
        artistName: { type: [string, "null"], minLength: 1, maxLength: 512 }
        year: { type: [integer, "null"], minimum: 1000, maximum: 2100 }
        language: { type: [string, "null"], pattern: "^[a-z]{2,3}$" }
        filmTitle: { type: [string, "null"], maxLength: 512 }
        filmYear: { type: [integer, "null"], minimum: 1890, maximum: 2100 }
        artwork: { type: "null", description: null puts back the cover from the files or lookup. }
    MatchDecision:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
    DevelopmentKey:
      type: object
      required: [key]
      properties:
        key: { type: string, examples: ["hive-dev-7k2q-9mxp-4c8a"] }
    # ------------------------------------------------------------ auth (M2)
    Platform:
      type: string
      enum: [android, ios, macos, windows, linux, web]
    InviteCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 64, description: 'The Hive code, typed ("HIVE-7K2Q-9MXP") or from the QR.' }
    InviteInfo:
      type: object
      required: [homeName, valid]
      properties:
        homeName: { type: string }
        valid: { type: boolean, description: 'False when used, cancelled or expired.' }
        email: { type: string, description: 'The address it is for, partly hidden ("b•••@gmail.com"), when it names one.' }
        expiresAt: { type: string, format: date-time }
    EmailStart:
      type: object
      required: [email, deviceName, platform]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        inviteCode: { type: string, maxLength: 64 }
        deviceName: { type: string, minLength: 1, maxLength: 80, description: 'What the device is called, e.g. "Bilal''s Pixel".' }
        platform: { $ref: "#/components/schemas/Platform" }
    EmailStarted:
      type: object
      required: [verificationId, expiresAt, resendAfterSeconds, emailSent]
      properties:
        verificationId: { type: string }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer }
        emailSent: { type: boolean, description: False while email isn't set up at home; the admin passes the code on. }
    EmailVerify:
      type: object
      required: [verificationId, code]
      properties:
        verificationId: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
    AccessRequestStatus:
      type: object
      required: [requestId, requestToken, status, homeName]
      properties:
        requestId: { type: string }
        requestToken: { type: string, description: Keep it to poll and to register the device; it works for 7 days. }
        status: { type: string, enum: [pending, approved, declined] }
        homeName: { type: string }
        name: { type: string, description: The person's name once known. }
    RequestPoll:
      type: object
      required: [requestToken]
      properties:
        requestToken: { type: string }
    DeviceRegistration:
      type: object
      required: [requestId, requestToken, publicKey, name, platform]
      properties:
        requestId: { type: string }
        requestToken: { type: string }
        publicKey: { type: string, description: 'The device''s Ed25519 public key, base64url (32 bytes).' }
        name: { type: string, minLength: 1, maxLength: 80 }
        platform: { $ref: "#/components/schemas/Platform" }
        appVersion: { type: string, maxLength: 32 }
        replaceDeviceId: { type: string, description: 'At the device limit, the device to remove to make room (counts as a swap).' }
    DeviceSession:
      type: object
      required: [deviceId, accessToken, accessExpiresAt, refreshToken, refreshExpiresAt, me]
      properties:
        deviceId: { type: string }
        accessToken: { type: string, description: 'Send as "Authorization: Bearer"; lasts 15 minutes.' }
        accessExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, description: Replaced on every use; lasts 30 days. }
        refreshExpiresAt: { type: string, format: date-time }
        me: { $ref: "#/components/schemas/Me" }
    ChallengeRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }
    Challenge:
      type: object
      required: [challenge, expiresAt]
      properties:
        challenge: { type: string, description: Sign these exact bytes (UTF-8) with the device key. }
        expiresAt: { type: string, format: date-time }
    TokenRefresh:
      type: object
      required: [deviceId, refreshToken, challenge, signature]
      properties:
        deviceId: { type: string }
        refreshToken: { type: string }
        challenge: { type: string }
        signature: { type: string, description: 'Ed25519 signature of the challenge, base64url.' }
    Me:
      type: object
      required: [id, name, email, role, simpleMode]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, member] }
        simpleMode: { type: boolean }
    MeEdit:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        simpleMode: { type: boolean }
    MyDevice:
      type: object
      required: [id, name, platform, current, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        appVersion: { type: string }
        current: { type: boolean, description: The device asking. }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    MyDevices:
      type: object
      required: [items, limit, swapsLeft, swapsPerMonth]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MyDevice" } }
        limit: { type: integer, description: Devices allowed at once. }
        swapsLeft: { type: integer, description: Devices that can still be removed in the last 30 days. }
        swapsPerMonth: { type: integer }

    # ------------------------------------------------------------ admin access (M2)
    AdminMe:
      type: object
      required: [id, name, email, authenticator]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        authenticator: { type: boolean, description: An authenticator app is set up (needed to sign in away from the home computer). }
    AdminSession:
      type: object
      required: [signedIn, onHomeComputer, needsSetup, emailReady]
      properties:
        signedIn: { type: boolean, description: This browser may use Hive Admin. }
        onHomeComputer: { type: boolean, description: 'Opened on the home computer itself, which is always allowed.' }
        needsSetup: { type: boolean, description: No admin exists yet; set one up on the home computer. }
        emailReady: { type: boolean, description: 'Email settings are saved, so codes can be sent.' }
        me: { $ref: "#/components/schemas/AdminMe" }
    AdminSetup:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
    AdminEmailStart:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AdminEmailVerify:
      type: object
      required: [verificationId, code]
      properties:
        verificationId: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
        authenticatorCode: { type: string, pattern: "^[0-9]{6}$", description: From the admin's authenticator app. }
    AuthenticatorSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: 'Base32, for typing into the app.' }
        uri: { type: string, description: 'otpauth:// link, for the QR code.' }
    AuthenticatorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    AdminAlert:
      type: object
      required: [level, text]
      properties:
        level: { type: string, enum: [info, warning, problem] }
        text: { type: string }
    AdminOverview:
      type: object
      required: [homeName, pendingRequests, people, devices, tracks, albums, sizeBytes, losslessPercent, emailReady, developmentKeyActive, alerts, recent]
      properties:
        homeName: { type: string }
        pendingRequests: { type: integer }
        songRequests: { type: integer, description: "M3: songs people asked for, not yet added or dismissed." }
        people: { type: integer }
        devices: { type: integer, description: Active devices. }
        tracks: { type: integer }
        albums: { type: integer }
        sizeBytes: { type: integer }
        losslessPercent: { type: integer }
        emailReady: { type: boolean }
        developmentKeyActive: { type: boolean, description: The M1 key still works because no admin is set up yet. }
        alerts: { type: array, items: { $ref: "#/components/schemas/AdminAlert" } }
        recent: { type: array, description: The last 8 entries of the audit log., items: { $ref: "#/components/schemas/AuditEntry" } }
    AdminAccessRequest:
      type: object
      required: [id, email, deviceName, platform, status, invited, existingPerson, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        deviceName: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        status: { type: string, enum: [pending, approved, declined] }
        invited: { type: boolean }
        existingPerson: { type: boolean, description: Already in the family; this is a new device. }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        undoUntil: { type: string, format: date-time, description: Until when Undo works. }
    PendingCode:
      type: object
      required: [email, code, purpose, expiresAt]
      properties:
        email: { type: string }
        code: { type: string }
        purpose: { type: string, enum: [join, admin] }
        expiresAt: { type: string, format: date-time }
    AdminRequests:
      type: object
      required: [items, codes]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminAccessRequest" } }
        codes:
          type: array
          description: While email isn't set up, the codes people are waiting for, to pass on in person or by message.
          items: { $ref: "#/components/schemas/PendingCode" }
    RequestDecision:
      type: object
      properties:
        note: { type: string, maxLength: 200, description: 'For you, e.g. "cousin, Dubai".' }
        name: { type: string, maxLength: 80, description: 'The person''s name, when approving someone new.' }
    InviteCreate:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254, description: Only this address can use it; empty for anyone with the code. }
        name: { type: string, maxLength: 80 }
        role: { type: string, enum: [member, admin], default: member }
        note: { type: string, maxLength: 200 }
        days: { type: integer, minimum: 1, maximum: 30, default: 7 }
    AdminInvite:
      type: object
      required: [id, role, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [member, admin] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        code: { type: string, description: Only when just created. }
        joinLink: { type: string, description: 'Only when just created: hive://join?… for the QR code and the app.' }
        privateNetworkLink: { type: string, description: 'The Tailscale share link saved in Settings, sent along with the invite.' }
        emailSent: { type: boolean, description: "Only when just created with an email: whether Hive emailed them the invite." }
    AdminInvites:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminInvite" } }
    AdminDevice:
      type: object
      required: [id, personId, personName, name, platform, status, createdAt]
      properties:
        id: { type: string }
        personId: { type: string }
        personName: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        appVersion: { type: string }
        status: { type: string, enum: [active, revoked] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    AdminDevices:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminDevice" } }
    AdminPerson:
      type: object
      required: [id, name, email, role, status, devicesUsed, deviceLimit, simpleMode, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, member] }
        status: { type: string, enum: [active, suspended] }
        devicesUsed: { type: integer }
        deviceLimit: { type: integer }
        deviceLimitOverride: { type: boolean, description: The limit is set for this person rather than the default. }
        simpleMode: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
    AdminPeople:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminPerson" } }
    AdminPersonDetail:
      type: object
      required: [person, devices, swapsUsed, swapsPerMonth, activity]
      properties:
        person: { $ref: "#/components/schemas/AdminPerson" }
        devices: { type: array, items: { $ref: "#/components/schemas/AdminDevice" } }
        swapsUsed: { type: integer, description: Devices removed in the last 30 days. }
        swapsPerMonth: { type: integer }
        activity: { type: array, description: Sign-ins and device changes (never what they listen to)., items: { $ref: "#/components/schemas/AuditEntry" } }
    PersonEdit:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string, enum: [admin, member] }
        status: { type: string, enum: [active, suspended] }
        deviceLimit: { type: ["integer", "null"], minimum: 1, maximum: 20, description: null goes back to the default. }
        simpleMode: { type: boolean }
        resetDevices: { type: boolean, description: Sign out every device of this person. }
    EmailSettings:
      type: object
      required: [host, port, security, username, from, passwordSet, ready]
      properties:
        host: { type: string, examples: ["smtp.gmail.com"] }
        port: { type: integer }
        security: { type: string, enum: [starttls, ssl, none] }
        username: { type: string }
        from: { type: string, description: The sender address shown to the family. }
        passwordSet: { type: boolean }
        ready: { type: boolean }
    EmailSettingsEdit:
      type: object
      properties:
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { type: string, enum: [starttls, ssl, none] }
        username: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 512, description: Empty removes it. }
        from: { type: string, maxLength: 254 }
    AdminSettings:
      type: object
      required: [homeName, devicesPerPerson, swapsPerMonth, email]
      properties:
        homeName: { type: string }
        devicesPerPerson: { type: integer }
        swapsPerMonth: { type: integer }
        address: { type: string, description: 'How apps reach home, put in invites (e.g. "http://100.84.12.7:8443").' }
        privateNetworkLink: { type: string, description: 'Tailscale''s share link for this computer, sent with every invite.' }
        minAppVersion: { type: string, description: "M4: apps older than this are asked to update." }
        email: { $ref: "#/components/schemas/EmailSettings" }
    AdminSettingsEdit:
      type: object
      properties:
        homeName: { type: string, minLength: 1, maxLength: 60 }
        devicesPerPerson: { type: integer, minimum: 1, maximum: 20 }
        swapsPerMonth: { type: integer, minimum: 0, maximum: 20 }
        address: { type: string, maxLength: 200 }
        privateNetworkLink: { type: string, maxLength: 500 }
        minAppVersion: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
        email: { $ref: "#/components/schemas/EmailSettingsEdit" }
    EmailTest:
      type: object
      properties:
        to: { type: string, format: email, maxLength: 254, description: Defaults to your own address. }
    EmailTestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    AuditEntry:
      type: object
      required: [id, at, actor, action, text]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: 'Who did it (an admin, a person, or "Hive").' }
        action: { type: string, description: 'Machine name, e.g. "request.approve".' }
        text: { type: string, description: 'What happened, in plain words.' }
    AuditPage:
      type: object
      required: [items, total, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        total: { type: integer }
        offset: { type: integer }
    TidyItem:
      type: object
      required: [trackId, albumId, albumTitle, before, after, applied]
      properties:
        trackId: { type: string }
        albumId: { type: string }
        albumTitle: { type: string }
        before: { type: string, description: The file's own title. }
        after: { type: string }
        applied: { type: boolean }
    TidyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TidyItem" } }
    TrackIds:
      type: object
      required: [trackIds]
      properties:
        trackIds: { type: array, items: { type: string }, minItems: 1, maxItems: 2000 }
    Suggestion:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [song, album, artist] }
        id: { type: string }
        text: { type: string }
        detail: { type: string, description: 'The artist for a song or album.' }
    Suggestions:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
    Pending:
      type: object
      description: Placeholder until this operation's milestone defines the real shape.
      additionalProperties: true

security:
  - deviceToken: []
  - adminSession: []
