name: CI

# Every push and pull request: the contract and generated code are in sync,
# the server, admin panel and app pass their tests, and the app builds for
# Android, Windows and macOS (downloadable from the run's Artifacts).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  generated:
    name: Contract and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install tools
        run: |
          pip install pyyaml openapi-spec-validator
          npm ci --prefix admin
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Contract is valid OpenAPI
        run: python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml')))"
      - name: Design tokens and icons are up to date
        run: python tools/gen_design.py --check
      - name: Dart API client is up to date
        run: python tools/gen_dart_client.py --check
      - name: TypeScript API types are up to date
        run: npm run check:api --prefix admin

  server:
    name: Server (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      # FFmpeg makes the test library and the Opus streams.
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=pytest-report.xml
      - name: Report failed tests
        if: failure()
        shell: bash
        run: python ../tools/junit_annotations.py pytest-report.xml

  lookup-live:
    name: Lookup against the real services
    runs-on: ubuntu-latest
    # MusicBrainz, Cover Art Archive or Wikidata being down must not block a
    # build; a failure here still shows, so a change in their answers is caught.
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_live_lookup.py -v --junitxml=pytest-report.xml
        env:
          HIVE_LIVE_LOOKUP: "1"
      - name: Report failed tests
        if: failure()
        run: python ../tools/junit_annotations.py pytest-report.xml

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: |
          pip install -e "./server[dev]"
          npm ci --prefix admin
          npx --prefix admin playwright install --with-deps chromium
      - run: npm run typecheck --prefix admin
      - run: npm test --prefix admin
      - run: npm run build --prefix admin
      - name: End-to-end against the real server
        run: npm run e2e --prefix admin
        env:
          HIVE_PYTHON: python
          HIVE_E2E_DATA: ${{ runner.temp }}/hive-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: admin/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: hive-admin-dist
          path: admin/dist
          retention-days: 14

  app:
    name: App (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated *.g.dart files are left exactly as the generators write them.
      - name: Formatting
        run: find lib test -name '*.dart' ! -name '*.g.dart' | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  app-live:
    name: App against a real server
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install FFmpeg and the server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -e "./server[dev]"
      - name: Start a server with a test library
        run: |
          DATA="$RUNNER_TEMP/hive-live"
          mkdir -p "$DATA/music"
          (cd server && python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from audio_fixtures import build_library; build_library(Path('$DATA/music'))")
          printf 'host = "127.0.0.1"\nport = 8555\nmusic_folders = ["%s"]\n' "$DATA/music" > "$DATA/hive.toml"
          HIVE_DATA_DIR="$DATA" HIVE_LOOKUP_ONLINE=false nohup python -m hive serve > "$DATA/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8555/api/v1/health >/dev/null && break; sleep 1; done
          echo "HIVE_LIVE_KEY=$(HIVE_DATA_DIR="$DATA" python -m hive info | awk '/development key/ {print $3}')" >> "$GITHUB_ENV"
      - name: Every app call against it
        working-directory: app
        run: |
          flutter pub get
          HIVE_LIVE_URL=http://127.0.0.1:8555 flutter test --tags live --run-skipped test/live_server_test.dart
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/hive-live/server.log"

  build-android:
    name: Build Android (APK)
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the debug key until a family release key is set up (M5).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hive-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  smoke-android:
    name: Android release app starts and plays (emulator)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: hive-android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      # A real home server for the playback test; the emulator reaches the
      # runner's 127.0.0.1 as 10.0.2.2.
      - name: Start a server with a test library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -e "./server[dev]"
          DATA="$RUNNER_TEMP/hive-phone"
          mkdir -p "$DATA/music"
          (cd server && python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from audio_fixtures import build_library; build_library(Path('$DATA/music'))")
          # Songs long enough not to end during the lock-screen key checks.
          for item in 1:One 2:Two 3:Three; do
            i="${item%%:*}"; n="${item#*:}"
            f="$DATA/music/Hive Test/Long Songs/0$i Long $n.mp3"
            mkdir -p "$(dirname "$f")"
            ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=$((300 + i * 70)):duration=120" \
              -ac 2 -c:a libmp3lame -b:a 96k -metadata title="Long $n" -metadata artist="Hive Test" \
              -metadata album="Long Songs" -metadata track="$i" "$f"
          done
          printf 'host = "127.0.0.1"\nport = 8556\nmusic_folders = ["%s"]\n' "$DATA/music" > "$DATA/hive.toml"
          HIVE_DATA_DIR="$DATA" HIVE_LOOKUP_ONLINE=false nohup python -m hive serve > "$DATA/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8556/api/v1/health >/dev/null && break; sleep 1; done
          echo "HIVE_PHONE_KEY=$(HIVE_DATA_DIR="$DATA" python -m hive info | awk '/development key/ {print $3}')" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          # One command per line: the runner starts each line on its own.
          script: |
            bash tools/android_smoke.sh apk/app-release.apk
            python3 tools/android_playback.py apk/app-release.apk 10.0.2.2:8556 "$HIVE_PHONE_KEY"
      - name: Server log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/hive-phone/server.log"

  build-windows:
    name: Build Windows
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Errors become annotations, readable without downloading the log.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build windows --release 2>&1 | tee build.log; then
            grep -iE "error|fatal|failed" build.log | grep -v "^\s*$" | head -40 | while IFS= read -r line; do
              echo "::error title=Windows build::${line:0:400}"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hive-windows
          path: app/build/windows/x64/runner/Release
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Not notarized until the Apple Developer account exists (M5); see docs/dev-setup.md
      # for opening it the first time.
      - name: flutter build macos
        shell: bash
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build.log || {
            echo "::error title=flutter build macos::$(grep -iE 'error|failed' build.log | tail -20 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      # A disk image keeps the app bundle exactly as built (framework symlinks,
      # signature); zips passed through browsers and unzip tools can break it.
      - name: Package as a disk image
        shell: bash
        run: |
          trap 'echo "::error title=Packaging::failed at: $BASH_COMMAND"' ERR
          mkdir -p dmg
          ditto build/macos/Build/Products/Release/Hive.app dmg/Hive.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Hive -srcfolder dmg -ov -format UDZO Hive-macOS.dmg
      - name: App in the disk image is intact and starts
        run: bash ../tools/macos_smoke.sh Hive-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hive-macos
          path: app/Hive-macOS.dmg
          retention-days: 30
