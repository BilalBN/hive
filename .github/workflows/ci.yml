name: CI

# Every push and pull request: the contract and generated code are in sync,
# the server, admin panel and app pass their tests, and the app builds for
# Android, Windows and macOS (downloadable from the run's Artifacts).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  generated:
    name: Contract and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install tools
        run: |
          pip install pyyaml openapi-spec-validator
          npm ci --prefix admin
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Contract is valid OpenAPI
        run: python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml')))"
      - name: Design tokens and icons are up to date
        run: python tools/gen_design.py --check
      - name: Dart API client is up to date
        run: python tools/gen_dart_client.py --check
      - name: TypeScript API types are up to date
        run: npm run check:api --prefix admin

  server:
    name: Server (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: |
          pip install -e "./server[dev]"
          npm ci --prefix admin
          npx --prefix admin playwright install --with-deps chromium
      - run: npm run typecheck --prefix admin
      - run: npm test --prefix admin
      - run: npm run build --prefix admin
      - name: End-to-end against the real server
        run: npm run e2e --prefix admin
        env:
          HIVE_PYTHON: python
          HIVE_E2E_DATA: ${{ runner.temp }}/hive-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: admin/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: hive-admin-dist
          path: admin/dist
          retention-days: 14

  app:
    name: App (analyze and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated *.g.dart files are left exactly as the generators write them.
      - name: Formatting
        run: find lib test -name '*.dart' ! -name '*.g.dart' | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android (APK)
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the debug key until a family release key is set up (M5).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hive-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  smoke-android:
    name: Android release app starts (emulator)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: hive-android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android_smoke.sh apk/app-release.apk

  build-windows:
    name: Build Windows
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: hive-windows
          path: app/build/windows/x64/runner/Release
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Not notarized until the Apple Developer account exists (M5); see docs/dev-setup.md
      # for opening it the first time.
      - run: flutter build macos --release
      # A disk image keeps the app bundle exactly as built (framework symlinks,
      # signature); zips passed through browsers and unzip tools can break it.
      - name: Package as a disk image
        run: |
          mkdir -p dmg
          ditto build/macos/Build/Products/Release/Hive.app dmg/Hive.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Hive -srcfolder dmg -ov -format UDZO Hive-macOS.dmg
      - name: App in the disk image is intact and starts
        run: bash ../tools/macos_smoke.sh Hive-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hive-macos
          path: app/Hive-macOS.dmg
          retention-days: 30
